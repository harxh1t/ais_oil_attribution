# All thresholds below are labeled with their status. Do not add new thresholds
# without the same labeling discipline.

ais_backend:
  provider: marinecadastre          # ENGINEERING ASSUMPTION: only backend implemented in v1
  us_waters_only: true              # MarineCadastre coverage limitation, documented fact
  geoparquet_base_url: null         # Optional override for NOAA MarineCadastre parquet store

search:
  spatial_radius_km: 50             # ENGINEERING ASSUMPTION: generous outer bound before
                                     # Hausdorff/Fréchet filtering narrows it; not a research value
  temporal_window_before_hours: 8   # matches Cerulean's documented AIS query window
  temporal_window_after_hours: 6    # matches Cerulean's documented AIS query window

interpolation:
  linear_max_gap_minutes: 5         # ENGINEERING ASSUMPTION, informed by literature consensus
                                     # that linear interpolation is adequate for short gaps
  spline_max_gap_minutes: 120       # beyond this, do not interpolate — flag as unknown
                                     # ENGINEERING ASSUMPTION: no published gap-length threshold found

regime_classification:
  # ENGINEERING RULE — no peer-reviewed source found for this specific threshold.
  # Classifies as "delayed" if the reported spread radius divided by a typical surface
  # current speed exceeds the reported time gap between plausible release and observation.
  typical_current_speed_km_per_hour: 1.8   # ~1 knot, a commonly cited average surface drift speed
                                             # (ENGINEERING ASSUMPTION — verify per region if possible)
  require_human_confirmation: true

candidate_filtering:
  hausdorff_prefilter_km: 25        # ENGINEERING ASSUMPTION: cheap coarse filter before
                                     # expensive Fréchet computation
  min_sog_knots_to_exclude_anchored: 0.5   # vessels below this SOG throughout the window
                                             # are excluded as non-transiting

attribution:
  # No peer-reviewed combination formula exists (see references, §14). Borda rank
  # aggregation is used as the least-arbitrary defensible combination absent training data.
  ranking_method: borda_count       # options: borda_count | logistic_regression (future)

confidence_labels:
  # ENGINEERING ASSUMPTION. These thresholds are illustrative starting points, not
  # validated cutoffs. The numeric score is always reported alongside the label.
  high_min_score: 0.75
  medium_min_score: 0.40
  # anything below medium_min_score is labeled LOW

drift_backtracking:
  model: openoil                    # opendrift.models.openoil.OpenOil
  oil_type: "GENERIC DIESEL"        # ENGINEERING ASSUMPTION: placeholder default, should be
                                     # overridden per-investigation once oil type is known
  seed_number: 2000
  seed_radius_m: 1000

cerulean_api:
  base_url: "https://api.cerulean.skytruth.org"
  coverage_start_date: "2023-01-01"  # documented fact: Cerulean detections begin Jan 2023;
                                       # earlier events require a manual polygon/time fallback

reporting:
  emit_case_experience: true           # Generates unified 4-stage case_experience.html

